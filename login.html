<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #D4E09B; /* Vanilla Custard */
            font-family: 'Roboto', sans-serif;
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: #CBDFBD; /* Tea Green */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        .btn-custom {
            background-color: #A44A3F; /* Reddish Brown */
            color: white;
            font-weight: bold;
        }

        .btn-custom:hover {
            background-color: #CBDFBD;
            color: black;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h3 class="text-center mb-4">Course Moderation System</h3>

        <form>
            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" class="form-control" placeholder="Enter your password">
            </div>

            <button class="btn btn-custom w-100 mt-3">Login</button>

            <p class="text-center mt-3">
                <a href="#" style="color:#A44A3F; font-weight:bold;">Forgot Password?</a>
            </p>

            <p class="text-center mt-3">
                <a href="dashboard.html" style="color:#A44A3F;">Continue to Dashboard</a>
            </p>
        </form>
    </div>

</body>
</html>
