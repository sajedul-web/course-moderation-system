<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #D4E09B; /* Vanilla Custard */
            font-family: 'Roboto', sans-serif;
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: #CBDFBD; /* Tea Green */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        .btn-custom {
            background-color: #A44A3F; /* Reddish Brown */
            color: white;
            font-weight: bold;
        }

        .btn-custom:hover {
            background-color: #CBDFBD;
            color: black;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h3 class="text-center mb-4">Course Moderation System</h3>

        <form id="loginForm">
            <div class="mb-3">
                <label>Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password">
            </div>

            <div id="errorMessage" class="alert alert-danger" role="alert" style="display: none;"></div>

            <div class="form-check mb-3">
                <input type="checkbox" id="rememberMe" class="form-check-input">
                <label for="rememberMe" class="form-check-label">Remember Me</label>
            </div>

            <button class="btn btn-custom w-100 mt-3" type="submit">Login</button>

            <p class="text-center mt-3">
                <a href="#" style="color:#A44A3F; font-weight:bold;">Forgot Password?</a>
            </p>

            <p class="text-center mt-3">
                Don't have an account?
                <a href="register.html" style="color:#A44A3F; font-weight:bold;">Create one</a>
            </p>
        </form>
    </div>

<script>
    const API_URL = 'http://localhost:5000';

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault(); // stop the page from reloading

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorBox = document.getElementById('errorMessage');
        errorBox.style.display = 'none';

        try {
            const response = await fetch(`${API_URL}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });

            const data = await response.json();

            if (!response.ok) {
                errorBox.textContent = data.error || 'Login failed.';
                errorBox.style.display = 'block';
                return;
            }

            // Remember Me checked -> localStorage (survives closing the browser)
            // Remember Me unchecked -> sessionStorage (cleared when the browser closes)
            const rememberMe = document.getElementById('rememberMe').checked;
            const storage = rememberMe ? localStorage : sessionStorage;

            storage.setItem('token', data.token);
            storage.setItem('user', JSON.stringify(data.user));

            window.location.href = 'dashboard.html';
        } catch (err) {
            errorBox.textContent = 'Could not reach the server. Is it running?';
            errorBox.style.display = 'block';
        }
    });
</script>
</body>
</html>
