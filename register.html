<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - CMS</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #D4E09B; /* Vanilla Custard */
            font-family: 'Roboto', sans-serif;
        }

        .login-box {
            max-width: 400px;
            margin: 80px auto;
            background: #CBDFBD; /* Tea Green */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        .btn-custom {
            background-color: #A44A3F; /* Reddish Brown */
            color: white;
            font-weight: bold;
        }

        .btn-custom:hover {
            background-color: #CBDFBD;
            color: black;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h3 class="text-center mb-4">Create Account</h3>

        <form id="registerForm">
            <div class="mb-3">
                <label>Full Name</label>
                <input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="Choose a password" required minlength="6">
            </div>

            <div class="mb-3">
                <label>I am a...</label>
                <select id="role" class="form-control">
                    <option value="lecturer">Lecturer (uploads assessments)</option>
                    <option value="reviewer">Reviewer (reviews assessments)</option>
                </select>
            </div>

            <div id="errorMessage" class="alert alert-danger" style="display:none;"></div>
            <div id="successMessage" class="alert alert-success" style="display:none;"></div>

            <button class="btn btn-custom w-100 mt-3" type="submit">Create Account</button>

            <p class="text-center mt-3">
                Already have an account?
                <a href="login.html" style="color:#A44A3F; font-weight:bold;">Login</a>
            </p>
        </form>
    </div>

<script>
    const API_URL = 'http://localhost:5000';

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const fullName = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;

        const errorBox = document.getElementById('errorMessage');
        const successBox = document.getElementById('successMessage');
        errorBox.style.display = 'none';
        successBox.style.display = 'none';

        try {
            const response = await fetch(`${API_URL}/api/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, email, password, role }),
            });

            const data = await response.json();

            if (!response.ok) {
                errorBox.textContent = data.error || 'Registration failed.';
                errorBox.style.display = 'block';
                return;
            }

            successBox.textContent = 'Account created! Redirecting to login...';
            successBox.style.display = 'block';
            document.getElementById('registerForm').reset();

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        } catch (err) {
            errorBox.textContent = 'Could not reach the server. Is it running?';
            errorBox.style.display = 'block';
        }
    });
</script>
</body>
</html>
